name: Build Standalone Executables

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --name metascrub pyinstaller_entry.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: metascrub-${{ runner.os }}
        path: |
          dist/metascrub
          dist/metascrub.exe

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir release
        cp artifacts/metascrub-Linux/metascrub release/metascrub-linux
        cp artifacts/metascrub-Windows/metascrub.exe release/metascrub-windows.exe
        cp artifacts/metascrub-macOS/metascrub release/metascrub-macos
        chmod +x release/metascrub-linux release/metascrub-macos

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          release/metascrub-linux
          release/metascrub-windows.exe
          release/metascrub-macos
