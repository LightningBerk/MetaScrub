name: Build Standalone Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    name: Determine next version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Compute next version
      id: bump
      run: |
        # Get the latest v* tag sorted by version
        LATEST_TAG=$(git tag --list 'v*' --sort=-v:refversion | head -n 1)

        if [ -z "$LATEST_TAG" ]; then
          echo "No existing tags found. Starting at v1.0.0"
          echo "new_version=v1.0.0" >> "$GITHUB_OUTPUT"
        else
          echo "Latest tag: $LATEST_TAG"
          # Strip the leading 'v'
          VERSION="${LATEST_TAG#v}"
          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Bump patch
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        fi

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --name metascrub pyinstaller_entry.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: metascrub-${{ runner.os }}
        path: |
          dist/metascrub
          dist/metascrub.exe

  release:
    name: Create GitHub Release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir release
        cp artifacts/metascrub-Linux/metascrub release/metascrub-linux
        cp artifacts/metascrub-Windows/metascrub.exe release/metascrub-windows.exe
        cp artifacts/metascrub-macOS/metascrub release/metascrub-macos
        chmod +x release/metascrub-linux release/metascrub-macos

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.new_version }}
        name: ${{ needs.version.outputs.new_version }}
        generate_release_notes: true
        files: |
          release/metascrub-linux
          release/metascrub-windows.exe
          release/metascrub-macos
